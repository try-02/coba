name: Compose Stability & Lint Analysis

on:
  workflow_dispatch:

defaults:
  run:
    working-directory: ./coba

jobs:
  analyze-stability:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        gradle-version: wrapper
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}
        add-job-summary: on-failure
        cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

    - name: Grant Execute Permission for Gradle
      run: chmod +x ./gradlew

    # LANGKAH BARU: Menjalankan Android Lint dengan aturan Slack yang sudah dipasang
    # Opsi --continue memastikan CI tetap menjalankan task berikutnya walaupun langkah ini menemukan eror
    - name: Run Slack Compose Lint Checks
      run: ./gradlew lintDebug --continue --no-daemon

    # Validasi kestabilan Compose menggunakan plugin Skydoves Anda sebelumnya
    - name: Run Compose Stability Check
      run: ./gradlew stabilityDump --no-daemon

    # Mengunggah seluruh dokumen laporan (Hasil Lint & Stabilitas Skydoves) ke Ringkasan GitHub Actions
    - name: Upload Analysis Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: compose-analysis-reports
        path: |
          coba/app/stability/*.stability
          coba/app/build/reports/lint-results-*.html
          coba/app/build/reports/lint-results-*.xml
