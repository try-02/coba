name: Compose Stability Analysis

on:
  workflow_dispatch:

defaults:
  run:
    working-directory: ./coba

jobs:
  analyze-stability:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    # PERBAIKAN: Indentasi disamakan (sejajar 4 spasi dari kiri)
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-provider: Enhanced
        gradle-version: wrapper
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}
        add-job-summary: on-failure
        # KRUSIAL UNTUK 9.6.1: Kunci enkripsi wajib ada agar Configuration Cache tersimpan di GitHub Actions
        cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

    - name: Grant Execute Permission for Gradle
      run: chmod +x ./gradlew

    # stabilityCheck membandingkan status kode saat ini dengan baseline snapshot.
    # Jika stabilitas menurun, build otomatis gagal di langkah ini.
    - name: Run Compose Stability Check
      run: ./gradlew stabilityDump --no-daemon

    # Mengunggah hasil file analisis stabilitas .stability ke halaman ringkasan GitHub Actions
    - name: Upload Stability Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: compose-stability-reports
        # PERBAIKAN: Menyesuaikan jalur relatif dari root repositori agar file .stability terdeteksi
        path: 'coba/app/stability/*.stability'
