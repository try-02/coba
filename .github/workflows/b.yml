name: Build Termux Wheels (Khusus Rust/Maturin)

on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Daftar paket (Hanya yang berbasis Rust/Maturin, misal: pydantic-core jiter tokenizers)'
        required: true
        default: 'pydantic-core==2.27.2 jiter'

jobs:
  build-android-wheels:
    name: Build Android Wheels
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Setup Zig (Linker cross-compile Android)
        uses: goto-bus-stop/setup-zig@v2

      - name: Install PyPA Build & Maturin
        run: pip install maturin build

      - name: Download & Build Packages
        run: |
          mkdir -p final_wheels
          
          for pkg in ${{ github.event.inputs.packages }}; do
            echo "========================================"
            echo "Memproses: $pkg"
            echo "========================================"
            
            mkdir -p "build_dir"
            cd build_dir
            
            # Download source dari PyPI
            pip download --no-binary :all: --no-deps "$pkg"
            
            # Ekstrak file (bisa .tar.gz atau .zip)
            file=$(ls | head -n 1)
            if [[ $file == *.zip ]]; then
              unzip "$file"
            else
              tar -xzf "$file"
            fi
            rm "$file"
            
            cd */
            
            # Eksekusi build khusus arsitektur Android 64-bit menggunakan Zig
            maturin build --release --target aarch64-linux-android --zig --out ../../final_wheels -i python3.14            
            cd ../../
            rm -rf build_dir
          done

      - name: Upload Artifact Wheels
        uses: actions/upload-artifact@v4
        with:
          name: termux-rust-wheels
          path: final_wheels/*.whl
