name: Build Termux Wheels (Rust/Maturin)

on:
  workflow_dispatch:

jobs:
  build-android-wheels:
    name: Build ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: 
          - "jiter"
          - "pydantic-core==2.46.4"

    steps:
      # Menggunakan Python 3.13 atau 3.14 sebagai host di GitHub Actions (jika tersedia)
      # Untuk memastikan kestabilan parsing, kita gunakan versi terbaru yang didukung runner
      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup Zig (Linker untuk Termux/Android)
        uses: goto-bus-stop/setup-zig@v2

      - name: Install Build Dependencies
        run: pip install maturin build typing_extensions

      - name: Download & Extract Source Code
        id: extract
        run: |
          pip download --no-binary :all: --no-deps ${{ matrix.package }}
          
          file=$(ls | grep -E '\.(tar\.gz|zip)$' | head -n 1)
          if [[ $file == *.zip ]]; then unzip "$file"; else tar -xzf "$file"; fi
          rm "$file"
          
          folder_name=$(find . -maxdepth 1 -type d ! -name "." | head -n 1)
          echo "src_dir=$folder_name" >> $GITHUB_OUTPUT

      # PERBAIKAN UTAMA: Set konfigurasi PyO3 khusus untuk Target CPython 3.14 Termux
      # abi3=false wajib agar fitur subclassing PyTzInfo di pydantic-core versi baru tidak error
      - name: Generate PyO3 Cross Config
        run: |
          cat <<EOF > pyo3-config.txt
          implementation=CPython
          version=3.14
          shared=true
          abi3=false
          lib_name=python3.14
          EOF
          echo "PYO3_CONFIG_FILE=$GITHUB_WORKSPACE/pyo3-config.txt" >> $GITHUB_ENV

      - name: Build Wheel using Maturin Action
        uses: PyO3/maturin-action@v1
        env:
          # 1. Matikan pendeteksian Android NDK lokal agar beralih penuh ke ZIG
          ANDROID_NDK_ROOT: ""
          ANDROID_NDK_HOME: ""
          
          # 2. Beritahu PyO3 bahwa ini adalah modul ekstensi distributor
          PYO3_BUILD_EXTENSION_MODULE: "1"
          
          # 3. Bendera untuk mengabaikan simbol eksternal saat proses linking biner
          RUSTFLAGS: "-C link-arg=-Wl,--unresolved-symbols=ignore-all"
        with:
          working-directory: ${{ steps.extract.outputs.src_dir }}
          target: aarch64-linux-android
          manylinux: off
          command: build
          # Ubah interpreter (-i) menjadi python3.14 dan set compatibility ke cpython
          args: --release --zig --out ../final_wheels -i python3.14 --compatibility off

      - name: Upload Wheel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: termux-wheel-${{ matrix.package }}
          path: final_wheels/*.whl
