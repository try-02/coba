name: Generate MobileNetV4 TFLite

on:
  workflow_dispatch: 

jobs:
  convert-model:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Buat requirements.txt sebagai acuan cache pip
      - name: Create requirements.txt
        run: |
          cat << 'EOF' > requirements.txt
          numpy==2.2.6
          torch
          torchvision
          timm
          onnx
          onnxscript
          onnx-graphsurgeon
          onnx2tf
          tensorflow
          tf-keras
          onnxsim
          psutil
          h5py
          ai-edge-litert
          sng4onnx
          sne4onnx
          snd4onnx
          snc4onnx
          sor4onnx
          scc4onnx
          sam4onnx
          EOF

      # 2. Set up Python dengan fitur Caching Pip Otomatis
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      # 3. Install Dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. TAHAP 1: Export PyTorch ke ONNX saja
      - name: "Step 1/3: Export PyTorch Model to ONNX"
        run: |
          cat << 'EOF' > export_onnx.py
          import sys
          from pathlib import Path
          import torch
          import timm

          output_dir = Path("model_conversion_output")
          output_dir.mkdir(exist_ok=True)

          print("[1/3] Loading PyTorch model from timm...")
          model = timm.create_model('mobilenetv4_conv_small.e2400_r224_in1k', pretrained=True, num_classes=0)
          model.eval()

          print("[2/3] Exporting to ONNX format...")
          onnx_path = output_dir / "mobilenet_v4_conv_small.onnx"
          dummy_input = torch.randn(1, 3, 224, 224)

          with torch.no_grad():
              torch.onnx.export(
                  model, dummy_input, str(onnx_path),
                  input_names=['input'], output_names=['embedding'],
                  opset_version=18, do_constant_folding=True
              )
          print(f"✓ Sukses Export ONNX: {onnx_path}")
          EOF
          
          python export_onnx.py

      # 5. TAHAP 2: Konversi ONNX ke TFLite via CLI onnx2tf
      - name: "Step 2/3: Convert ONNX to TFLite using onnx2tf CLI"
        run: |
          onnx2tf -i model_conversion_output/mobilenet_v4_conv_small.onnx -o model_conversion_output -osd

      # 6. TAHAP 3: Verifikasi Model TFLite
      - name: "Step 3/3: Verify TFLite Model"
        run: |
          cat << 'EOF' > verify_tflite.py
          import sys
          from pathlib import Path
          import shutil
          import numpy as np

          output_dir = Path("model_conversion_output")
          tflite_files = list(output_dir.glob("**/*.tflite"))

          if not tflite_files:
              print("ERROR: File TFLite gagal dihasilkan.")
              sys.exit(1)

          generated_tflite = tflite_files[0]
          for f in tflite_files:
              if "float32" in f.name:
                  generated_tflite = f
                  break

          final_tflite_path = "mobilenetv4_conv_small.tflite" 
          shutil.copy(generated_tflite, final_tflite_path)

          print("\n[Verification] Testing TFLite model...")
          import tensorflow as tf
          interpreter = tf.lite.Interpreter(model_path=final_tflite_path)
          interpreter.allocate_tensors()

          input_details = interpreter.get_input_details()
          output_details = interpreter.get_output_details()

          input_shape = input_details[0]['shape']
          print(f"  Input Shape : {input_shape}")
          print(f"  Output Shape: {output_details[0]['shape']}")

          test_input = np.random.randn(*input_shape).astype(np.float32)
          interpreter.set_tensor(input_details[0]['index'], test_input)
          interpreter.invoke()
          output = interpreter.get_tensor(output_details[0]['index'])

          output_dim = output.shape[-1]
          print(f"  Dimension   : {output_dim} (expected: 960)")

          if output_dim != 960:
              print(f"  ✗ WARNING: Unexpected dimension!")
              sys.exit(1)
          else:
              print(f"  ✓ Verification passed! Model siap digunakan.")
          EOF

          python verify_tflite.py

      # 7. Upload Artifact TFLite
      - name: Upload TFLite Artifact (1 Day Retention)
        uses: actions/upload-artifact@v4
        with:
          name: mobilenetv4-embeddings-tflite
          path: mobilenetv4_conv_small.tflite
          retention-days: 1