[versions]
# Core Build & Kotlin
agp = "9.5.0-alpha01"
kotlin = "2.4.20-RC"
ksp = "2.3.11"
kotlinxSerialization = "1.11.0"

# Database & Async
room = "3.0.1"
sqlite = "2.7.0"
coroutines = "1.11.0"

# AndroidX & Lifecycle
coreKtx = "1.19.0"
lifecycle = "2.12.0-alpha01"
activityCompose = "1.13.0"

# Compose
composeBom = "2026.08.00"
navigationCompose = "2.10.0-rc01" # Versi standar penunjang Compose
pagingCompose = "3.5.1"             # Penunjang rekomendasi pagination kita

# Dependency Injection
koin = "4.0.0" # Versi Koin mutakhir untuk Compose

# Hardware & Utilities (POS Specific)
escpos = "3.4.0"
camerax = "1.7.0-alpha03"
mlkitBarcode = "17.3.0"
fastexcel = "0.20.2"
aaltoXml = "1.4.0"
staxApi = "1.0-2"

[libraries]
# Core
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }

# Compose Framework
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

# Navigation & Paging
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-paging-compose = { group = "androidx.paging", name = "paging-compose", version.ref = "pagingCompose" }

# Database (Room 3.0.1 + Bundled SQLite)
room-runtime = { group = "androidx.room3", name = "room3-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room3", name = "room3-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room3", name = "room3-compiler", version.ref = "room" }
room-paging = { group = "androidx.room3", name = "room3-paging", version.ref = "room" }
sqlite-bundled = { group = "androidx.sqlite", name = "sqlite-bundled", version.ref = "sqlite" }

# Async / Coroutines
coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# Dependency Injection (Koin)
koin-androidx-compose = { group = "io.insert-koin", name = "koin-androidx-compose", version.ref = "koin" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# Hardware Integration (Printer & Barcode Scanner)
escpos-printer = { group = "com.github.DantSu", name = "ESCPOS-ThermalPrinter-Android", version.ref = "escpos" }
camerax-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
camerax-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
camerax-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
camerax-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }
mlkit-barcode = { group = "com.google.mlkit", name = "barcode-scanning", version.ref = "mlkitBarcode" }

# Export/Import Reports
fastexcel = { group = "org.dhatim", name = "fastexcel", version.ref = "fastexcel" }
aalto-xml = { group = "com.fasterxml", name = "aalto-xml", version.ref = "aaltoXml" }
stax-api = { group = "javax.xml.stream", name = "stax-api", version.ref = "staxApi" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" } # Wajib untuk Kotlin 2.x
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room3", version.ref = "room" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
